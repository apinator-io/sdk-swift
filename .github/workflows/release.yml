name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Config lives in release-please-config.json and .release-please-manifest.json.
      # The manifest form is what allows `extra-files`, which keeps SDKInfo.version
      # (sent as ?version= on connect) in step with each release.
      - uses: googleapis/release-please-action@v4
